# NDSP M2 governed UI Bridge entrypoint
# Production topology: canonical source snapshot runtime + live venv.
# Install with a late-sorting drop-in name such as:
# /etc/systemd/system/ndsp-ui-bridge-api.service.d/zz-ndsp-m2-governed.conf
[Service]
Environment=NDSP_AUTH_SESSION_URL=http://127.0.0.1:19091/api/auth/session
Environment=NDSP_CAPABILITY_REGISTRY_PATH=/home/nawaf511/empire-core-v5-1-1-clean/apps/ndsp-ui-bridge-api/capability_registry.json
ExecStart=
ExecStart=/home/nawaf511/empire-core-v5-1-1-clean/apps/ndsp-ui-bridge-api/venv/bin/uvicorn main_governed:app --host 127.0.0.1 --port 9066
