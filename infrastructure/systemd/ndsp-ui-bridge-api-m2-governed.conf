# NDSP M2 governed UI Bridge entrypoint
# Installed as /etc/systemd/system/ndsp-ui-bridge-api.service.d/20-ndsp-m2-governed.conf
# Keeps the existing service identity/working directory and changes only the ASGI entrypoint.
[Service]
Environment=NDSP_AUTH_SESSION_URL=http://127.0.0.1:9020/api/auth/session
ExecStart=
ExecStart=/usr/bin/python3 -m uvicorn main_governed:app --host 127.0.0.1 --port 9066
