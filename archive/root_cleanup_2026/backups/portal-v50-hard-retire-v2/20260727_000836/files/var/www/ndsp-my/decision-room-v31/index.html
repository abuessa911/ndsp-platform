<title>NDSP</title>
<script>
(function(){
  'use strict';
  window.__NDSP_LEGACY_ACCESS_PURGED_V89__=true;
  var portal='/portal-v50/?ndsp_source=purged-legacy-route&v=89&ts='+Date.now();
  var login='/login/?next='+encodeURIComponent('/portal-v50/')+'&ndsp_source=purged-legacy-route&v=89&ts='+Date.now();
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ try{r.unregister();}catch(e){} });
      }).catch(function(){});
    }
    if(window.caches&&caches.keys){
      caches.keys().then(function(keys){
        keys.forEach(function(k){ caches.delete(k).catch(function(){}); });
      }).catch(function(){});
    }
  }catch(e){}
  fetch('/api/auth/session',{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error('no-session'); return r.json(); })
    .then(function(d){
      var ok=!!(d&&(d.ok===true||d.authenticated===true||d.user||d.email||d.session));
      location.replace(ok?portal:login);
    })
    .catch(function(){ location.replace(login); });
})();
</script>

<!-- NDSP_SELECTED_CONTEXT_FLOW_RUNTIME_V2_BEGIN -->
<script id="ndsp-selected-context-flow-runtime-v2">
(function () {
    "use strict";

    const ROOT_CLASS =
        "ndsp-context-flow-page";

    const SHELL_CLASS =
        "ndsp-selected-context-shell-flow";

    const CARD_CLASS =
        "ndsp-selected-context-card-flow";

    const normalizeText = function (value) {
        return String(value || "")
            .replace(/\u00a0/g, " ")
            .replace(/\s+/g, " ")
            .trim();
    };

    const elementText = function (element) {
        if (!element) {
            return "";
        }

        return normalizeText(
            element.innerText ||
            element.textContent ||
            ""
        );
    };

    const getActionText = function (element) {
        return normalizeText(
            element.textContent ||
            element.value ||
            element.getAttribute("aria-label") ||
            element.getAttribute("title") ||
            ""
        );
    };

    const containsStartAnalysisAction = function (
        element
    ) {
        if (!element || !element.querySelectorAll) {
            return false;
        }

        const actions = element.querySelectorAll(
            [
                "button",
                "a",
                "[role='button']",
                "input[type='button']",
                "input[type='submit']"
            ].join(",")
        );

        for (const action of actions) {
            const text = getActionText(action);

            if (
                text.includes("ابدأ التحليل") ||
                text.includes("ابدأ التحليل الآن") ||
                text.includes("Start Analysis")
            ) {
                return true;
            }
        }

        return false;
    };

    const findTextElement = function (
        exactValues,
        partialValues
    ) {
        const selectors = [
            "h1",
            "h2",
            "h3",
            "h4",
            "h5",
            "h6",
            "[role='heading']",
            "legend",
            "label",
            "strong",
            ".title",
            ".heading",
            "div",
            "span",
            "p"
        ].join(",");

        const elements =
            document.querySelectorAll(selectors);

        let partialMatch = null;

        for (const element of elements) {
            const text = elementText(element);

            if (!text) {
                continue;
            }

            if (exactValues.includes(text)) {
                return element;
            }

            if (
                !partialMatch &&
                text.length <= 90 &&
                partialValues.some(function (value) {
                    return text.includes(value);
                })
            ) {
                partialMatch = element;
            }
        }

        return partialMatch;
    };

    const findSelectedContextTitle = function () {
        return findTextElement(
            [
                "السياق المختار",
                "Selected Context"
            ],
            [
                "السياق المختار",
                "Selected Context"
            ]
        );
    };

    const findDisplayLevelTitle = function () {
        return findTextElement(
            [
                "5. اختر مستوى العرض",
                "اختر مستوى العرض",
                "5. Choose display level",
                "Choose display level"
            ],
            [
                "اختر مستوى العرض",
                "Choose display level"
            ]
        );
    };

    const findSelectedContextCard = function (
        title
    ) {
        if (!title) {
            return null;
        }

        let current = title;

        for (
            let depth = 0;
            current &&
            current !== document.body &&
            depth < 14;
            depth += 1
        ) {
            if (
                containsStartAnalysisAction(current)
            ) {
                return current;
            }

            current = current.parentElement;
        }

        return title.parentElement;
    };

    const isLikelyFloatingWrapper = function (
        element
    ) {
        if (!element || element === document.body) {
            return false;
        }

        let position = "";

        try {
            position =
                window.getComputedStyle(element)
                    .position || "";
        } catch (error) {
            position = "";
        }

        const classText =
            typeof element.className === "string"
                ? element.className
                : "";

        return (
            position === "fixed" ||
            position === "sticky" ||
            position === "absolute" ||
            /fixed|sticky|floating|float|dock|overlay|selected-context|context-summary/i
                .test(classText)
        );
    };

    const findSelectedContextShell = function (
        card
    ) {
        if (!card) {
            return null;
        }

        let shell = card;
        let current = card.parentElement;

        for (
            let depth = 0;
            current &&
            current !== document.body &&
            depth < 7;
            depth += 1
        ) {
            const text = elementText(current);

            if (
                !text.includes("السياق المختار") &&
                !text.includes("Selected Context")
            ) {
                break;
            }

            if (
                !containsStartAnalysisAction(current)
            ) {
                break;
            }

            if (isLikelyFloatingWrapper(current)) {
                shell = current;
            }

            current = current.parentElement;
        }

        return shell;
    };

    const findDisplayLevelSection = function (
        title
    ) {
        if (!title) {
            return null;
        }

        let current = title;
        let best = title.parentElement || title;

        for (
            let depth = 0;
            current &&
            current.parentElement &&
            current.parentElement !== document.body &&
            depth < 12;
            depth += 1
        ) {
            const parent =
                current.parentElement;

            const parentText =
                elementText(parent);

            const includesSelectedContext =
                parentText.includes(
                    "السياق المختار"
                ) ||
                parentText.includes(
                    "Selected Context"
                );

            if (
                includesSelectedContext &&
                containsStartAnalysisAction(parent)
            ) {
                break;
            }

            best = parent;
            current = parent;
        }

        return best;
    };

    const clearConflictingStyles = function (
        element
    ) {
        if (!element || !element.style) {
            return;
        }

        const properties = [
            "position",
            "inset",
            "top",
            "right",
            "bottom",
            "left",
            "translate",
            "transform",
            "z-index",
            "height",
            "max-height",
            "overflow",
            "margin-top",
            "margin-bottom"
        ];

        for (const property of properties) {
            element.style.removeProperty(property);
        }
    };

    const clearPreviousMarkers = function () {
        const oldShells =
            document.querySelectorAll(
                "." + SHELL_CLASS
            );

        for (const element of oldShells) {
            element.classList.remove(
                SHELL_CLASS
            );
        }

        const oldCards =
            document.querySelectorAll(
                "." + CARD_CLASS
            );

        for (const element of oldCards) {
            element.classList.remove(
                CARD_CLASS
            );
        }
    };

    const placeAfterDisplayLevel = function (
        shell,
        displaySection
    ) {
        if (!shell || !displaySection) {
            return;
        }

        if (
            shell === displaySection ||
            shell.contains(displaySection)
        ) {
            return;
        }

        const alreadyImmediatelyAfter =
            displaySection.nextElementSibling ===
            shell;

        if (alreadyImmediatelyAfter) {
            return;
        }

        try {
            displaySection.insertAdjacentElement(
                "afterend",
                shell
            );
        } catch (error) {
            return;
        }
    };

    const applyFix = function () {
        const selectedTitle =
            findSelectedContextTitle();

        if (!selectedTitle) {
            return false;
        }

        const selectedCard =
            findSelectedContextCard(
                selectedTitle
            );

        if (!selectedCard) {
            return false;
        }

        const selectedShell =
            findSelectedContextShell(
                selectedCard
            ) || selectedCard;

        const displayTitle =
            findDisplayLevelTitle();

        const displaySection =
            findDisplayLevelSection(
                displayTitle
            );

        document.documentElement.classList.add(
            ROOT_CLASS
        );

        clearPreviousMarkers();

        selectedShell.classList.add(
            SHELL_CLASS
        );

        selectedCard.classList.add(
            CARD_CLASS
        );

        selectedShell.setAttribute(
            "data-ndsp-context-flow",
            "v2"
        );

        selectedCard.setAttribute(
            "data-ndsp-context-card",
            "v2"
        );

        clearConflictingStyles(
            selectedShell
        );

        if (selectedCard !== selectedShell) {
            clearConflictingStyles(
                selectedCard
            );
        }

        placeAfterDisplayLevel(
            selectedShell,
            displaySection
        );

        return true;
    };

    let queued = false;
    let applying = false;

    const queueApply = function () {
        if (queued || applying) {
            return;
        }

        queued = true;

        window.requestAnimationFrame(
            function () {
                queued = false;
                applying = true;

                try {
                    applyFix();
                } finally {
                    applying = false;
                }
            }
        );
    };

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            queueApply,
            { once: true }
        );
    } else {
        queueApply();
    }

    window.addEventListener(
        "load",
        queueApply,
        { once: true }
    );

    window.addEventListener(
        "resize",
        queueApply,
        { passive: true }
    );

    window.addEventListener(
        "orientationchange",
        queueApply,
        { passive: true }
    );

    window.addEventListener(
        "pageshow",
        queueApply,
        { passive: true }
    );

    const observer =
        new MutationObserver(function (
            mutations
        ) {
            for (const mutation of mutations) {
                if (
                    mutation.type === "childList" &&
                    (
                        mutation.addedNodes.length ||
                        mutation.removedNodes.length
                    )
                ) {
                    queueApply();
                    break;
                }
            }
        });

    observer.observe(
        document.documentElement,
        {
            childList: true,
            subtree: true
        }
    );

    [
        50,
        150,
        350,
        700,
        1200,
        2000,
        3500,
        5000
    ].forEach(function (delay) {
        window.setTimeout(
            queueApply,
            delay
        );
    });
})();
</script>
