function stateArabic(s){const x=String(s||'').toUpperCase();if(x.includes('COMPLETE')||x.includes('GOLDEN')||x.includes('ARMED'))return'مكتملة';if(x.includes('BLOCK'))return'محجوبة';if(x.includes('MONITOR')||x.includes('REVIEW')||x.includes('PENDING'))return'تحت المراقبة';if(x.includes('CAUTIOUS'))return'مراقبة حذرة';return s||'غير متاحة'}
function extractPrice(q){return Number(pick(q,['instrument.live_price','live_price','price','data.price','market.price','quote.price','current_price']))}
function extractChange(q){return Number(pick(q,['instrument.change_24h','change24h','change_percent','data.change_percent','quote.changePercent','market.change_pct']))}
function extractQuality(q){return pick(q,['decision_quality','quality','scenario.confidence_band','confidence_band','confidence','decision.quality'])||'—'}
function extractDirection(q){return pick(q,['scenario.scenario_directional_context','scenario_directional_context','directional_context','trend_context','decision.direction'])||'لا توجد قراءة اتجاهية متاحة'}
function level(q,name){const map={activation:['scenario.scenario_activation_level','scenario_activation_level','levels.activation','activation_level'],arrival:['scenario.scenario_arrival_level','scenario_arrival_level','levels.arrival','arrival_level'],review:['scenario.scenario_review_level','scenario_review_level','levels.review','review_level'],invalidation:['scenario.scenario_invalidation_level','scenario_invalidation_level','levels.cancel','levels.invalidation','invalidation_level','cancel_level'],nmp:['nmp.level','nmp_level','levels.nmp','analysis.nmp.level']};return pick(q,map[name]||[])}
function riskValue(q){const r=pick(q,['risk.score','risk_score','risk.value','risk_level','decision.risk']);const n=Number(r);if(Number.isFinite(n))return Math.max(0,Math.min(100,n));const s=String(r||'').toLowerCase();if(s.includes('high')||s.includes('مرتفع'))return 82;if(s.includes('low')||s.includes('منخفض'))return 30;return 52}
function completeness(q){const n=Number(pick(q,['decision_completeness','completeness','progress','decision.progress']));if(Number.isFinite(n))return Math.max(0,Math.min(100,n));const s=stateText(q).toUpperCase();if(s.includes('COMPLETE')||s.includes('ARMED'))return 100;if(s.includes('MONITOR'))return 65;if(s.includes('BLOCK'))return 25;return 48}
async function fetchQuality(symbol,timeframe='weekly'){
 const urls=[`/api/decision/quality-live?symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}`,`/api/decision/quality?symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}`,`/api/completed-decisions?symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}`];
 for(const url of urls){try{const r=await timeoutFetch(url);if(!r.ok)continue;const j=await r.json();if(j&&typeof j==='object')return j}catch{}}
 return null;
}
function normalizeCandle(x){
 const t=Number(x.time??x.timestamp??x.ts??x.datetime??x.date??x[0]);
 const time=Number.isFinite(t)?(t>1e12?t:t*1000):Date.parse(x.time??x.datetime??x.date);
 const open=Number(x.open??x.o??x[1]),high=Number(x.high??x.h??x[2]),low=Number(x.low??x.l??x[3]),close=Number(x.close??x.c??x[4]),volume=Number(x.volume??x.v??x[5]??0);
 return Number.isFinite(time)&&[open,high,low,close].every(Number.isFinite)?{time,open,high,low,close,volume}:null;
}
function findCandleArray(j){const candidates=[j,j?.data,j?.candles,j?.ohlcv,j?.data?.candles,j?.data?.ohlcv,j?.result,j?.values,j?.series];for(const c of candidates)if(Array.isArray(c)&&c.length&&normalizeCandle(c[0]))return c;return null}
async function fetchCandles(symbol,timeframe='weekly',quality=null){
 const embedded=findCandleArray(quality);if(embedded)return embedded.map(normalizeCandle).filter(Boolean).sort((a,b)=>a.time-b.time).slice(-260);
 const qs=`symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}&limit=260`;
 const urls=[`/api/market/candles?${qs}`,`/api/market-data/candles?${qs}`,`/api/ohlcv?${qs}`,`/api/candles?${qs}`,`/api/market/ohlcv?${qs}`,`/api/technical/candles?${qs}`];
 for(const url of urls){try{const r=await timeoutFetch(url,9000);if(!r.ok)continue;const j=await r.json();const arr=findCandleArray(j);if(arr){const out=arr.map(normalizeCandle).filter(Boolean).sort((a,b)=>a.time-b.time).slice(-260);if(out.length>=20)return out}}catch{}}
 return [];
}
async function fetchNews(){
 const urls=['/api/news?limit=30','/api/market/news?limit=30','/api/events?limit=30','/api/economic-calendar?limit=30'];
 for(const url of urls){try{const r=await timeoutFetch(url,7000);if(!r.ok)continue;const j=await r.json();const arr=Array.isArray(j)?j:(j.items||j.news||j.events||j.data);if(Array.isArray(arr))return arr}catch{}}
 return [];
}

function alertsPage(){const rows=read('ndspAlerts',[]);return header('التنبيهات','تنبيهات سعرية وتنبيهات مرتبطة بحالة القرار. يتم تقييمها عندما تكون الصفحة مفتوحة ومتصلًا بالبيانات.','<button class="gold-btn" data-modal="alert">إنشاء تنبيه</button>')+`<div class="card"><div class="card-body">${rows.map((r,i)=>{const p=state.marketData[r.symbol]?.price;return `<div class="list-row"><div><b>${r.symbol}</b><div class="muted" style="font-size:10px;margin-top:4px">${r.type==='price'?'السعر '+r.op+' '+r.value:'تغير حالة القرار إلى '+r.value}</div></div><span class="pill ${r.enabled?'green':''}">${r.enabled?'نشط':'متوقف'}</span><span class="muted">الحالي: ${Number.isFinite(p)?fmt(p,4):'—'}</span><div class="push"><button class="ghost-btn" data-toggle-alert="${i}">${r.enabled?'إيقاف':'تشغيل'}</button> <button class="ghost-btn danger" data-remove-alert="${i}">حذف</button></div></div>`}).join('')||'<div class="empty"><strong>لا توجد تنبيهات</strong>أنشئ تنبيهًا سعريًا أو مرتبطًا بحالة القرار.</div>'}</div></div>`}
function newsPage(){const n=state.news;return header('الأخبار والأحداث','يُعرض المحتوى فقط عندما تكون بوابة الأخبار أو التقويم الاقتصادي متصلة بواجهة NDSP. لا تُنشأ أخبار تجريبية.')+(n.length?`<div class="grid g2">${n.map(x=>`<article class="card"><div class="card-body"><div class="asset-meta"><span class="pill gold">${esc(x.category||x.type||'سوق')}</span><span class="pill">${esc(x.time||x.date||'')}</span></div><h3>${esc(x.title||x.headline||x.name||'حدث')}</h3><p class="muted" style="font-size:11px;line-height:1.7">${esc(x.summary||x.description||x.body||'')}</p></div></article>`).join('')}</div>`:`<div class="card"><div class="empty"><strong>بوابة الأخبار غير متصلة حاليًا</strong>القسم جاهز للربط مع واجهة الأخبار والتقويم الاقتصادي. لم يتم عرض محتوى وهمي أو مصادر خارجية غير محكومة.</div></div>`)}
function reportsPage(){const snapshots=read('ndspDecisionSnapshots',[]);return header('القرارات والتقارير','سجل محلي للتغيرات التي رصدتها الواجهة، مع إمكانية حفظ لقطة حالية للقرارات.','<button class="gold-btn" data-snapshot>حفظ لقطة حالية</button>')+`<div class="card"><div class="card-body">${snapshots.slice().reverse().map(s=>`<div class="list-row"><div><b>${esc(s.at)}</b><div class="muted" style="font-size:10px;margin-top:4px">${s.items.length} قراءة محفوظة</div></div><div class="push"><button class="ghost-btn" data-view-snapshot="${esc(s.id)}">عرض</button></div></div>`).join('')||'<div class="empty"><strong>لا توجد لقطات محفوظة</strong>احفظ لقطة لتتبع تغير القراءات بمرور الوقت.</div>'}</div></div>`}
function guidePage(){return header('دليل الاستخدام','دليل مختصر يشرح ترتيب القراءة ويمنع الخلط بين التحليل والقرار.')+`<div class="grid g2"><section class="card"><div class="card-head"><h3>للمستخدم البسيط</h3></div><div class="card-body"><ol style="line-height:2;color:#cfc8bc;font-size:12px"><li>ابدأ من حالة القرار: مكتملة، تحت المراقبة، أو محجوبة.</li><li>افهم الاتجاه الحاكم، ولا تعتبره أمر شراء أو بيع.</li><li>راجع جاهزية القرار مقابل قوة القراءة.</li><li>راقب مستويات التفعيل والوصول والمراجعة والإلغاء.</li><li>افتح الشارت لرؤية الأدلة نفسها التي تستخدمها المنظومة.</li></ol></div></section><section class="card"><div class="card-head"><h3>للمستخدم المحترف</h3></div><div class="card-body"><ol style="line-height:2;color:#cfc8bc;font-size:12px"><li>افصل القراءة الاستثمارية عن المضاربية.</li><li>راجع TDL والتصحيح والزخم والانحراف وNMP.</li><li>اقرأ المخاطر وسياق الدولار قبل التأكيد النهائي.</li><li>لا تستخدم مؤشرًا خارج مجموعة NDSP لتغيير القرار الحاكم داخل المنصة.</li><li>تتبع السجل لمعرفة كيف تغيرت القراءة ولماذا.</li></ol></div></section><section class="card"><div class="card-head"><h3>مؤشرات الشارت المعتمدة</h3></div><div class="card-body"><div class="asset-meta"><span class="pill gold">RSI</span><span class="pill gold">MACD Histogram</span><span class="pill gold">OBV</span><span class="pill gold">CCI</span><span class="pill">الانحراف العادي</span><span class="pill">الانحراف الخفي</span><span class="pill">NMP</span><span class="pill">مستويات السيناريو</span></div><p class="muted" style="font-size:11px;line-height:1.8">لا توجد مكتبة مؤشرات مفتوحة؛ لأن هدف الشارت تفسير قرار NDSP لا إنشاء تحليل موازٍ يناقض المنظومة.</p></div></section><section class="card"><div class="card-head"><h3>تسلسل القراءة</h3></div><div class="card-body"><p style="line-height:2;color:#cfc8bc;font-size:12px">الحالة الحاكمة ← الاتجاه والسياق ← مستويات السيناريو ← NMP ← الزخم والانحراف ← المخاطر وسياق الدولار ← محامي الشيطان ← التأكيد النهائي.</p></div></section></div>`}
function settingsPage(){return header('الإعدادات والحساب','إعدادات هذه المساحة تُحفظ محليًا في متصفح المستخدم.')+`<div class="grid g2"><section class="card"><div class="card-head"><h3>طريقة العرض</h3></div><div class="card-body"><div class="list-row"><div><b>العرض الافتراضي</b><div class="muted" style="font-size:10px">البسيط يقلل التفاصيل، والمحترف يعرض الأدلة كاملة.</div></div><select id="settingMode" class="field push"><option value="simple" ${state.viewMode==='simple'?'selected':''}>بسيط</option><option value="pro" ${state.viewMode==='pro'?'selected':''}>محترف</option></select></div><div class="list-row"><div><b>دورية تحديث الأسعار</b><div class="muted" style="font-size:10px">لا تقل عن 15 ثانية لتجنب الضغط على الخدمة.</div></div><select id="settingPoll" class="field push"><option value="15000" ${state.pollMs===15000?'selected':''}>15 ثانية</option><option value="30000" ${state.pollMs===30000?'selected':''}>30 ثانية</option><option value="60000" ${state.pollMs===60000?'selected':''}>دقيقة</option><option value="120000" ${state.pollMs===120000?'selected':''}>دقيقتان</option></select></div></div></section><section class="card"><div class="card-head"><h3>البيانات والخصوصية</h3></div><div class="card-body"><div class="notice">قوائم المراقبة والمحفظة والتنبيهات واللقطات تحفظ محليًا في هذا المتصفح. الأسعار والقرارات تأتي من واجهات NDSP على النطاق نفسه. لا ترسل هذه المساحة بيانات محفظتك إلى مزود خارجي.</div><button class="ghost-btn danger" style="margin-top:12px" data-clear-local>مسح البيانات المحلية لهذه المساحة</button></div></section></div>`}
function readingLabel(){return state.readingMode==='speculative'?'مضاربية':'استثمارية'}
function sequenceControls(){return `<section class="card sequence-section" id="reading-controls"><div class="card-head"><h3>اختيار القراءة والعرض</h3><span class="pill reading-badge">${readingLabel()}</span></div><div class="card-body"><div class="control-strip"><div class="control-block"><label>الأصل</label><select id="sequenceSymbol" class="field">${ASSETS.map(a=>`<option value="${a.symbol}" ${a.symbol===state.symbol?'selected':''}>${a.name} · ${a.symbol}</option>`).join('')}</select></div><div class="control-block"><label>الإطار الزمني</label><select id="timeframe" class="field"><option value="daily" ${state.timeframe==='daily'?'selected':''}>يومي</option><option value="weekly" ${state.timeframe==='weekly'?'selected':''}>أسبوعي</option><option value="monthly" ${state.timeframe==='monthly'?'selected':''}>شهري</option></select></div><div class="control-block"><label>نمط القراءة</label><select id="readingMode" class="field"><option value="investment" ${state.readingMode==='investment'?'selected':''}>استثمارية</option><option value="speculative" ${state.readingMode==='speculative'?'selected':''}>مضاربية</option></select></div><div class="control-block"><label>طريقة العرض</label><select id="sequenceViewMode" class="field"><option value="simple" ${state.viewMode==='simple'?'selected':''}>بسيط</option><option value="pro" ${state.viewMode==='pro'?'selected':''}>محترف</option></select></div></div></div></section>`}
function sequenceNavigation(){return `<div class="sequence-nav"><button data-scroll="decision-summary">ملخص القرار</button><button data-scroll="reading-strength">القوة والجاهزية</button><button data-scroll="missing-reading">سبب عدم الاكتمال</button><button data-scroll="scenario-levels">مستويات السيناريو</button><button data-scroll="nmp-reference">NMP</button><button data-scroll="technical-chart">الشارت والتحليل الفني</button><button data-scroll="risk-section">المخاطر</button><button data-scroll="evidence-section">الأدلة التحليلية</button><button data-scroll="advanced-section">التفاصيل المتقدمة</button></div>`}
function assetPage(){const a=assetMeta(state.symbol),d=state.marketData[state.symbol]||{},q=state.quality||d.q||{},price=extractPrice(q)||d.price,change=extractChange(q)||d.change;return `<section class="card"><div class="workspace-head"><div class="asset-hero"><div><h1>${a.name} <span class="muted">${a.symbol}</span></h1><div class="asset-meta"><span class="pill">${a.market}</span>${decisionBadge(q)}<span class="pill gold">${esc(extractQuality(q))}</span><span class="pill reading-badge">${readingLabel()}</span></div></div><div class="big-price">${Number.isFinite(price)?fmt(price,4):'—'} <small class="${directionClass(change)}" style="font-size:13px">${Number.isFinite(change)?(change>0?'+':'')+fmt(change)+'%':'—'}</small></div><span class="pill">آخر تحديث: ${now()}</span><span class="pill ${state.candles.length?'green':'gold'}">البيانات: ${state.candles.length?'شموع حية':'جارٍ التحميل'}</span><button class="ghost-btn" data-add-watch="${a.symbol}">☆ مراقبة</button><button class="gold-btn" data-modal="alert" data-symbol="${a.symbol}">إنشاء تنبيه</button></div>${sequenceNavigation()}</div></section>${sequenceControls()}${assetOverview(q)}<section class="sequence-section" id="technical-chart">${assetChart(q)}</section><section class="sequence-section" id="risk-section">${assetRisk(q)}</section><section class="sequence-section" id="evidence-section">${assetEvidence(q)}</section><section class="sequence-section pro-only" id="advanced-section">${assetAdvanced(q)}</section><section class="sequence-section"><div class="grid g2"><section class="card"><div class="card-head"><h3>الأخبار والأحداث المرتبطة</h3></div><div class="card-body"><a class="gold-btn" href="#/news" style="text-decoration:none">فتح الأخبار والأحداث</a></div></section><section class="card"><div class="card-head"><h3>سجل القراءة</h3></div><div class="card-body"><a class="ghost-btn" href="#/reports" style="text-decoration:none">فتح القرارات والتقارير</a></div></section></div></section>`}
function chartPage(){const a=assetMeta(state.symbol),q=state.quality||state.marketData[state.symbol]?.q||{};return header('الشارت والتحليل الفني',`شارت ${a.name} مع مؤشرات NDSP المعتمدة فقط. الشارت هنا صفحة مستقلة وواضحة، وليس مخفيًا داخل قسم آخر.`,`<a class="ghost-btn" href="#/asset/${a.symbol}" style="text-decoration:none">فتح التسلسل الكامل</a>`)+sequenceControls()+`<section class="sequence-section" id="technical-chart">${assetChart(q)}</section><section class="sequence-section" id="risk-section">${assetRisk(q)}</section><section class="sequence-section" id="evidence-section">${assetEvidence(q)}</section>`}
function assetOverview(q){const levels=[level(q,'activation'),level(q,'arrival'),level(q,'review'),level(q,'invalidation')].filter(v=>v!==null&&v!==undefined).length;return `<section class="card sequence-section" id="decision-summary"><div class="card-head"><h3>ملخص القرار والحالة الحاكمة</h3>${decisionBadge(q)}</div><div class="card-body"><h2 style="font-size:18px;margin-top:0">${esc(extractDirection(q))}</h2><p class="muted" style="font-size:11px;line-height:1.8">${esc(pick(q,['caution_reason','reason','scenario.caution_reason','explanation.summary','decision.reason'])||'لا يتوفر تفسير تفصيلي إضافي من واجهة البيانات الحالية.')}</p><div class="asset-meta"><span class="pill gold">الجودة: ${esc(extractQuality(q))}</span><span class="pill">القراءة: ${readingLabel()}</span><span class="pill ${state.viewMode==='pro'?'gold':''}">العرض: ${state.viewMode==='pro'?'محترف':'بسيط'}</span></div></div></section><div class="grid g2 sequence-section" id="reading-strength"><section class="card"><div class="card-head"><h3>قوة القراءة مقابل جاهزية القرار</h3></div><div class="card-body">${progressHtml('اكتمال القراءة',completeness(q))}${progressHtml('سلامة المخاطر',100-riskValue(q))}${progressHtml('جودة بيانات الشموع',state.candles.length?95:(extractPrice(q)?65:20))}${progressHtml('اكتمال مستويات السيناريو',levels*25)}</div></section><section class="card" id="missing-reading"><div class="card-head"><h3>سبب عدم اكتمال القراءة</h3></div><div class="card-body"><p class="muted" style="font-size:11px;line-height:1.8">${esc(pick(q,['missing_requirements','incomplete_reason','scenario.incomplete_reason','decision.missing'])||'لم ترسل واجهة القرار قائمة محددة بالنواقص. راجع التصحيح وNMP والزخم والمخاطر قبل اعتبار القراءة مكتملة.')}</p></div></section></div><section class="card sequence-section" id="scenario-levels"><div class="card-head"><h3>مستويات السيناريو</h3><span class="pill">تفسيرية وليست أوامر تنفيذ</span></div><div class="card-body"><div class="level-grid">${levelBox('التفعيل',level(q,'activation'))}${levelBox('الوصول',level(q,'arrival'))}${levelBox('المراجعة',level(q,'review'))}${levelBox('الإلغاء',level(q,'invalidation'))}</div></div></section><section class="card sequence-section" id="nmp-reference"><div class="card-head"><h3>المستوى المرجعي NMP</h3><span class="pill gold">نقطة التقاء نواف</span></div><div class="card-body"><div style="font-size:27px;font-weight:900">${level(q,'nmp')??'—'}</div><p class="muted" style="font-size:10px;line-height:1.7">يظهر المستوى فقط عندما ترسله منظومة القرار؛ ولا تنشئ الواجهة مستوى بديلًا.</p></div></section>`}
function progressHtml(labelName,v){return `<div class="progress-row"><div class="progress-label"><span>${labelName}</span><b>${Math.round(v)}%</b></div><div class="progress"><span style="width:${Math.round(v)}%"></span></div></div>`}
function assetChart(q){return `<div class="two-col"><div><section class="card"><div class="card-head"><h3>الشارت السعري</h3><div class="switches"><label><input type="checkbox" data-flag="levels" ${state.chartFlags.levels?'checked':''}> مستويات السيناريو</label><label><input type="checkbox" data-flag="nmp" ${state.chartFlags.nmp?'checked':''}> NMP</label><label><input type="checkbox" data-flag="divergence" ${state.chartFlags.divergence?'checked':''}> الانحراف</label></div></div><div class="card-body"><div class="chart-shell"><canvas id="priceChart" class="chart"></canvas>${state.candles.length?'<div class="chart-overlay"></div>':'<div class="chart-empty"><div><strong>بيانات الشموع الحقيقية غير متاحة</strong>تم فحص واجهات OHLC المعروفة ولم تُرجع بيانات كافية. لن تنشئ NDSP شموعًا وهمية. السعر والقرار يظلان متاحين من واجهة القرار.</div></div>'}</div><div class="ind-grid"><div class="ind-panel"><h5>RSI</h5><canvas id="rsiChart"></canvas></div><div class="ind-panel"><h5>MACD Histogram</h5><canvas id="macdChart"></canvas></div><div class="ind-panel"><h5>OBV</h5><canvas id="obvChart"></canvas></div><div class="ind-panel"><h5>CCI</h5><canvas id="cciChart"></canvas></div></div></div></section></div><div class="side-stack"><section class="card"><div class="card-head"><h3>المؤشرات المعتمدة فقط</h3></div><div class="card-body"><div class="switches" style="display:grid"><label><input type="checkbox" data-flag="rsi" ${state.chartFlags.rsi?'checked':''}> مؤشر القوة النسبية RSI</label><label><input type="checkbox" data-flag="macd" ${state.chartFlags.macd?'checked':''}> MACD Histogram</label><label><input type="checkbox" data-flag="obv" ${state.chartFlags.obv?'checked':''}> OBV</label><label><input type="checkbox" data-flag="cci" ${state.chartFlags.cci?'checked':''}> CCI</label></div><div class="notice" style="margin-top:12px">لا يمكن إضافة مؤشرات خارج منظومة NDSP من هذه الواجهة. الهدف تفسير القرار، لا بناء تحليل موازٍ.</div></div></section><section class="card"><div class="card-head"><h3>المستويات</h3></div><div class="card-body"><div class="decision-list">${levelRow('التفعيل',level(q,'activation'),'#d8aa4a')}${levelRow('الوصول',level(q,'arrival'),'#42cf8b')}${levelRow('المراجعة',level(q,'review'),'#6ba9ff')}${levelRow('الإلغاء',level(q,'invalidation'),'#f06d72')}${levelRow('NMP',level(q,'nmp'),'#f0cd7a')}</div></div></section></div></div>`}
function levelRow(n,v,c){return `<div class="list-row"><span style="width:9px;height:9px;border-radius:99px;background:${c}"></span><b>${n}</b><span class="push">${v??'—'}</span></div>`}
function radarMetrics(q){const levels=['activation','arrival','review','invalidation'].filter(n=>level(q,n)!==null&&level(q,n)!==undefined).length;return [['اكتمال القراءة',completeness(q)],['سلامة المخاطر',100-riskValue(q)],['جودة البيانات',state.candles.length?95:(extractPrice(q)?65:20)],['اكتمال المستويات',levels*25],['جاهزية NMP',level(q,'nmp')!==null&&level(q,'nmp')!==undefined?100:20],['وضوح الحالة',stateText(q)&&stateText(q)!=='غير متاح'?85:25]]}
function assetRisk(q){const metrics=radarMetrics(q);return `<div class="risk-layout"><section class="card"><div class="card-head"><h3>رادار المخاطر واكتمال القرار</h3><span class="pill">مؤشرات تفسيرية مشتقة</span></div><div class="card-body risk-radar-shell"><canvas id="riskRadar" class="radar"></canvas></div></section><section class="card"><div class="card-head"><h3>مفتاح قراءة الرادار</h3></div><div class="card-body"><div class="risk-legend">${metrics.map(([n,v])=>`<div class="list-row"><b>${n}</b><span class="push pill ${v>=70?'green':v<40?'red':'gold'}">${Math.round(v)}%</span></div>`).join('')}</div><div class="notice" style="margin-top:12px">كلما اقترب الشكل من الحافة ارتفع اكتمال البعد المعروض. ارتفاع سلامة المخاطر يعني أن المخاطر أقل، وليس أنها أعلى.</div></div></section></div>`}
function assetAdvanced(q){const allowed=[['TDL',pick(q,['tdl.state','analysis.tdl','evidence.tdl','layers.tdl'])],['NMP',pick(q,['nmp.state','analysis.nmp.state','evidence.nmp'])],['إشارة نواف الذهبية',pick(q,['golden_signal','analysis.golden_signal','evidence.golden_signal'])],['إشارة نواف الذهبية المعززة',pick(q,['enhanced_golden_signal','analysis.enhanced_golden_signal','evidence.enhanced_golden_signal'])],['محامي الشيطان',pick(q,['devils_advocate','analysis.devils_advocate','evidence.devils_advocate'])]];return `<section class="card"><div class="card-head"><h3>التفاصيل المتقدمة المسموح بعرضها</h3><span class="pill gold">العرض المحترف</span></div><div class="card-body"><p class="final-sequence-note">لا تعرض هذه الصفحة أسماء الخدمات الداخلية أو العقود البرمجية أو تفاصيل التنفيذ. تعرض فقط الطبقات العامة المعتمدة للمستخدم.</p><div class="grid g2" style="margin-top:12px">${allowed.map(([n,v])=>`<div class="decision-item"><div class="decision-top"><h4>${n}</h4><span class="pill ${v?'green':''}">${v?'متاح':'غير مرسل'}</span></div><p>${esc(typeof v==='object'?JSON.stringify(v):v||'لا توجد تفاصيل عامة مرسلة لهذه الطبقة.')}</p></div>`).join('')}</div></div></section>`}

function assetEvidence(q){const evidence=[['TDL',pick(q,['tdl.state','analysis.tdl','evidence.tdl','layers.tdl'])],['التصحيح',pick(q,['correction.state','analysis.correction','evidence.correction'])],['NMP',pick(q,['nmp.state','analysis.nmp.state','evidence.nmp'])],['الزخم',pick(q,['momentum.state','analysis.momentum','evidence.momentum'])],['الانحراف',pick(q,['divergence.state','analysis.divergence','evidence.divergence'])],['المخاطر',pick(q,['risk.level','risk_level','decision.risk'])],['سياق الدولار',pick(q,['usd_context','macro.usd','analysis.usd'])],['محامي الشيطان',pick(q,['devils_advocate','analysis.devils_advocate','evidence.devils_advocate'])]];return `<div class="grid g2">${evidence.map(([n,v])=>`<section class="card"><div class="card-head"><h3>${n}</h3><span class="pill ${v?'gold':''}">${v?'متاح':'غير مرسل'}</span></div><div class="card-body"><p class="muted" style="font-size:11px;line-height:1.8">${esc(typeof v==='object'?JSON.stringify(v):v||'لم ترسل واجهة القرار الحالية تفاصيل هذا الدليل. لا تُنشئ الواجهة نتيجة بديلة.')}</p></div></section>`).join('')}</div>`}

function sma(v,n){return v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n)}
function ema(v,n){const k=2/(n+1);let out=[],prev=null;v.forEach((x,i)=>{prev=prev===null?x:(x*k+prev*(1-k));out[i]=prev});return out}
function rsi(c,n=14){const out=Array(c.length).fill(null);let gains=0,losses=0;for(let i=1;i<c.length;i++){const d=c[i].close-c[i-1].close;if(i<=n){gains+=Math.max(0,d);losses+=Math.max(0,-d);if(i===n){let ag=gains/n,al=losses/n;out[i]=al===0?100:100-(100/(1+ag/al));for(let j=i+1;j<c.length;j++){const x=c[j].close-c[j-1].close;ag=(ag*(n-1)+Math.max(0,x))/n;al=(al*(n-1)+Math.max(0,-x))/n;out[j]=al===0?100:100-(100/(1+ag/al))}break}}}return out}
function macd(c){const v=c.map(x=>x.close),e12=ema(v,12),e26=ema(v,26),line=v.map((_,i)=>e12[i]-e26[i]),sig=ema(line,9);return line.map((x,i)=>x-sig[i])}
function obv(c){let x=0;return c.map((v,i)=>{if(i){if(v.close>c[i-1].close)x+=v.volume||0;else if(v.close<c[i-1].close)x-=v.volume||0}return x})}
function cci(c,n=20){const tp=c.map(x=>(x.high+x.low+x.close)/3),ma=sma(tp,n);return tp.map((x,i)=>{if(ma[i]===null)return null;const part=tp.slice(i-n+1,i+1),md=part.reduce((s,v)=>s+Math.abs(v-ma[i]),0)/n;return md?((x-ma[i])/(.015*md)):0})}
function prepCanvas(canvas){const dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(rect.width*dpr));canvas.height=Math.max(1,Math.floor(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w:rect.width,h:rect.height}}
function drawGrid(ctx,w,h){ctx.strokeStyle='#29241b';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,(h/6)*i);ctx.lineTo(w,(h/6)*i);ctx.stroke()}for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo((w/8)*i,0);ctx.lineTo((w/8)*i,h);ctx.stroke()}}
function drawPrice(q){const cv=$('#priceChart');if(!cv||!state.candles.length)return;const {ctx,w,h}=prepCanvas(cv),c=state.candles.slice(-120),pad={t:18,r:62,b:25,l:8};drawGrid(ctx,w,h);const lows=c.map(x=>x.low),highs=c.map(x=>x.high);let min=Math.min(...lows),max=Math.max(...highs);const levs=['activation','arrival','review','invalidation','nmp'].map(n=>Number(String(level(q,n)||'').replace(/,/g,''))).filter(Number.isFinite);if(levs.length){min=Math.min(min,...levs);max=Math.max(max,...levs)}const range=max-min||1,y=v=>pad.t+(max-v)/(range)*(h-pad.t-pad.b),step=(w-pad.l-pad.r)/c.length,bw=Math.max(2,step*.62);c.forEach((x,i)=>{const xx=pad.l+i*step+step/2,up=x.close>=x.open;ctx.strokeStyle=up?'#42cf8b':'#f06d72';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(xx,y(x.high));ctx.lineTo(xx,y(x.low));ctx.stroke();const yy=Math.min(y(x.open),y(x.close)),hh=Math.max(1,Math.abs(y(x.open)-y(x.close)));ctx.fillRect(xx-bw/2,yy,bw,hh)});if(state.chartFlags.levels||state.chartFlags.nmp){const defs=[['activation','#d8aa4a','تفعيل'],['arrival','#42cf8b','وصول'],['review','#6ba9ff','مراجعة'],['invalidation','#f06d72','إلغاء'],['nmp','#f0cd7a','NMP']];defs.forEach(([n,col,labelName])=>{if(n==='nmp'&&!state.chartFlags.nmp)return;if(n!=='nmp'&&!state.chartFlags.levels)return;const v=Number(String(level(q,n)||'').replace(/,/g,''));if(!Number.isFinite(v))return;ctx.setLineDash([5,4]);ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(0,y(v));ctx.lineTo(w,y(v));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font='10px Tahoma';ctx.fillText(labelName+' '+fmt(v,4),Math.max(4,w-58),y(v)-4)})}ctx.fillStyle='#958d80';ctx.font='10px monospace';for(let i=0;i<5;i++){const v=max-(range/4)*i;ctx.fillText(fmt(v,4),w-58,pad.t+((h-pad.t-pad.b)/4)*i)}if(state.chartFlags.divergence)drawDivergence(ctx,c,y,step,pad)}
function drawDivergence(ctx,c,y,step,pad){const r=rsi(c);const piv=[];for(let i=3;i<c.length-3;i++)if(c[i].low<Math.min(c[i-1].low,c[i-2].low,c[i+1].low,c[i+2].low))piv.push(i);if(piv.length>=2){const a=piv[piv.length-2],b=piv[piv.length-1];if(c[b].low<c[a].low&&r[b]>r[a]){ctx.strokeStyle='#f0cd7a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad.l+a*step+step/2,y(c[a].low));ctx.lineTo(pad.l+b*step+step/2,y(c[b].low));ctx.stroke();ctx.fillStyle='#f0cd7a';ctx.font='10px Tahoma';ctx.fillText('انحراف صاعد',pad.l+b*step-40,y(c[b].low)+18)}}}
function drawSeries(id,values,opt={}){const cv=$(id);if(!cv)return;const {ctx,w,h}=prepCanvas(cv);drawGrid(ctx,w,h);const v=values.slice(-120),valid=v.filter(Number.isFinite);if(!valid.length)return;let min=opt.min??Math.min(...valid),max=opt.max??Math.max(...valid);if(min===max){min-=1;max+=1}const y=x=>10+(max-x)/(max-min)*(h-20),step=w/Math.max(1,v.length-1);if(opt.zero&&min<0&&max>0){ctx.strokeStyle='#665d50';ctx.beginPath();ctx.moveTo(0,y(0));ctx.lineTo(w,y(0));ctx.stroke()}if(opt.bars){v.forEach((x,i)=>{if(!Number.isFinite(x))return;ctx.fillStyle=x>=0?'#42cf8b':'#f06d72';const yy=y(x),z=y(0);ctx.fillRect(i*step,Math.min(yy,z),Math.max(1,step*.7),Math.max(1,Math.abs(z-yy)))})}else{ctx.strokeStyle=opt.color||'#d8aa4a';ctx.lineWidth=1.5;ctx.beginPath();let started=false;v.forEach((x,i)=>{if(!Number.isFinite(x))return;const xx=i*step,yy=y(x);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});ctx.stroke()}if(opt.lines)opt.lines.forEach(l=>{ctx.strokeStyle=l.color||'#665d50';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,y(l.value));ctx.lineTo(w,y(l.value));ctx.stroke();ctx.setLineDash([])})}
function drawRiskRadar(q){const cv=$('#riskRadar');if(!cv)return;const {ctx,w,h}=prepCanvas(cv),metrics=radarMetrics(q),cx=w/2,cy=h/2,r=Math.max(40,Math.min(w,h)*.34),count=metrics.length;ctx.clearRect(0,0,w,h);for(let ring=1;ring<=5;ring++){ctx.beginPath();metrics.forEach((_,i)=>{const a=-Math.PI/2+(Math.PI*2*i/count),rr=r*ring/5,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.strokeStyle='#29241b';ctx.stroke()}metrics.forEach(([name],i)=>{const a=-Math.PI/2+(Math.PI*2*i/count),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#29241b';ctx.stroke();ctx.fillStyle='#a9a297';ctx.font='10px Tahoma';ctx.textAlign=x<cx-5?'right':x>cx+5?'left':'center';ctx.fillText(name,cx+Math.cos(a)*(r+18),cy+Math.sin(a)*(r+18))});ctx.beginPath();metrics.forEach(([,value],i)=>{const a=-Math.PI/2+(Math.PI*2*i/count),rr=r*Math.max(0,Math.min(100,value))/100,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(216,170,74,.20)';ctx.strokeStyle='#d8aa4a';ctx.lineWidth=2;ctx.fill();ctx.stroke()}

 $$('[data-wtab]').forEach(b=>b.onclick=()=>workspaceTab(b.dataset.wtab));$('#timeframe')?.addEventListener('change',async e=>{state.timeframe=e.target.value;state.candles=[];await loadAsset()});$('#sequenceSymbol')?.addEventListener('change',e=>{state.symbol=e.target.value;state.candles=[];location.hash='#/'+(state.route==='chart'?'chart':'asset')+'/'+state.symbol});$('#readingMode')?.addEventListener('change',e=>{state.readingMode=e.target.value;localStorage.setItem('ndspReadingMode',state.readingMode);render()});$('#sequenceViewMode')?.addEventListener('change',e=>{state.viewMode=e.target.value;localStorage.setItem('ndspViewMode',state.viewMode);updateMode();render()});$$('[data-flag]').forEach(x=>x.onchange=()=>{state.chartFlags[x.dataset.flag]=x.checked;requestAnimationFrame(()=>drawAllCharts(state.quality||{}))});
 $('[data-snapshot]')?.addEventListener('click',saveSnapshot);$('#settingMode')?.addEventListener('change',e=>{state.viewMode=e.target.value;localStorage.setItem('ndspViewMode',state.viewMode);updateMode();render()});$('#settingPoll')?.addEventListener('change',e=>{state.pollMs=Number(e.target.value);localStorage.setItem('ndspPollMs',String(state.pollMs));resetPoll();toast('تم تحديث دورية التحديث')});$('[data-clear-local]')?.addEventListener('click',()=>{['ndspWatchlist','ndspPortfolio','ndspAlerts','ndspDecisionSnapshots'].forEach(k=>localStorage.removeItem(k));toast('تم مسح البيانات المحلية');render()});
}
function updateMode(){const pro=state.viewMode==='pro';$('#viewModeLabel').textContent=pro?'محترف':'بسيط';$('#modeBtn').textContent='العرض: '+(pro?'محترف':'بسيط');document.body.classList.toggle('pro',pro)}
function closeMenu(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}
function resetPoll(){clearInterval(window.__poll);window.__poll=setInterval(async()=>{await loadMarket(true);evaluateAlerts()},Math.max(15000,state.pollMs))}
renderNav();updateMode();renderTicker();parseRoute();render();loadMarket();fetchNews().then(n=>{state.news=n;if(state.route==='news')render()});resetPoll();
window.addEventListener('hashchange',render);window.addEventListener('resize',()=>{if((state.route==='asset'||state.route==='chart')&&($('#priceChart')||$('#riskRadar')))drawAllCharts(state.quality||{})});
$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show')};$('#overlay').onclick=closeMenu;$('#modeBtn').onclick=()=>{state.viewMode=state.viewMode==='simple'?'pro':'simple';localStorage.setItem('ndspViewMode',state.viewMode);updateMode();render()};
$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toUpperCase();const a=ASSETS.find(x=>x.symbol.includes(q)||x.name.includes(e.target.value.trim()));if(a)location.hash='#/asset/'+a.symbol;else toast('لم يتم العثور على الأصل')});
setInterval(evaluateAlerts,10000);
