<!doctype html>
<html lang="ar" dir="rtl" dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>استعادة كلمة المرور — NDSP</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050706;
      --panel: #0b0e0c;
      --panel-2: #10130f;
      --border: rgba(218, 176, 42, .52);
      --gold: #e0bb3e;
      --gold-2: #f1d76a;
      --text: #f4f1e8;
      --muted: #aaa69b;
      --danger: #ff8e8e;
      --success: #98e0ac;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(218,176,42,.08), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 660px);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(16,19,15,.98), rgba(7,9,8,.98));
      box-shadow: 0 24px 70px rgba(0,0,0,.48);
      padding: clamp(24px, 5vw, 48px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-2);
      font-weight: 800;
      letter-spacing: .04em;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 13px;
      height: 13px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(224,187,62,.65);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.15;
    }

    .intro {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.9;
    }

    label {
      display: block;
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 58px;
      border: 1px solid #3a3d37;
      border-radius: 16px;
      background: #050706;
      color: var(--text);
      padding: 0 18px;
      font-size: 17px;
      direction: ltr;
      text-align: left;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(224,187,62,.13);
    }

    button {
      width: 100%;
      min-height: 60px;
      margin-top: 22px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--gold-2), #ca9416);
      color: #121006;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .66;
    }

    .message {
      display: none;
      margin-top: 20px;
      border-radius: 14px;
      padding: 14px 16px;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      color: var(--success);
      border: 1px solid rgba(152,224,172,.36);
      background: rgba(152,224,172,.08);
    }

    .message.error {
      display: block;
      color: var(--danger);
      border: 1px solid rgba(255,142,142,.36);
      background: rgba(255,142,142,.08);
    }

    .back {
      display: block;
      width: max-content;
      margin: 24px auto 0;
      color: var(--gold-2);
      font-weight: 800;
      text-decoration: none;
    }

    .privacy {
      margin: 24px 0 0;
      color: #7f817a;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .card { border-radius: 22px; padding: 24px 20px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> NDSP</div>
      <h1 id="page-title">نسيت كلمة المرور؟</h1>
      <p class="intro">أدخل بريد حسابك، وسنرسل لك رابطًا آمنًا ومؤقتًا لتعيين كلمة مرور جديدة.</p>

      <form id="forgotForm" novalidate>
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="name@example.com"
          required
        >

        <button id="submitBtn" type="submit">إرسال رابط إعادة التعيين</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>

      <a class="back" href="/login/">العودة إلى تسجيل الدخول</a>
      <p class="privacy">لحماية الخصوصية، تظهر الرسالة نفسها سواء كان البريد مسجلًا أم غير مسجل.</p>
    </section>
  </main>

  <script>
  (function () {
    "use strict";

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(type, text) {
      message.className = "message " + type;
      message.textContent = text;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email || !emailInput.checkValidity()) {
        showMessage("error", "أدخل بريدًا إلكترونيًا صحيحًا.");
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري الإرسال...";
      showMessage("success", "جاري معالجة الطلب...");

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          cache: "no-store",
          credentials: "same-origin",
          body: JSON.stringify({ email: email })
        });

        let data = null;

        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {
          const errorText = data && (data.message || data.error);
          throw new Error(errorText || "تعذر إرسال الطلب حاليًا.");
        }

        showMessage(
          "success",
          "تم استلام الطلب. إذا كان البريد مرتبطًا بحساب فستصلك رسالة إعادة التعيين خلال وقت قصير."
        );

        form.reset();
      } catch (error) {
        showMessage(
          "error",
          error && error.message ? error.message : "تعذر إرسال الطلب حاليًا. حاول مرة أخرى."
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "إرسال رابط إعادة التعيين";
      }
    });
  }());
  </script>
</body>
</html>
