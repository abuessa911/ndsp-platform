<!-- NDSP_SUPPORT_CONTACT_V59_BEGIN -->
<script id="NDSP_SUPPORT_CONTACT_V59">
(function(){
  var path=(location.pathname||'').replace(/\/+$/,'');
  if(!/(?:^|\/)support-center(?:\.html)?$/i.test(path)) return;
  function mount(){
    if(document.getElementById('ndsp-support-contact-v59')) return;
    var host=document.querySelector('main')||document.querySelector('[role="main"]')||document.body;
    if(!host) return;
    var card=document.createElement('section');
    card.id='ndsp-support-contact-v59';
    card.setAttribute('dir','auto');
    card.style.cssText='margin:24px auto;padding:20px;max-width:920px;border:1px solid rgba(212,175,55,.55);border-radius:18px;background:rgba(10,10,12,.92);color:#f5f1e6;box-shadow:0 12px 32px rgba(0,0,0,.28);font-family:inherit';
    card.innerHTML='<h2 style="margin:0 0 10px;color:#d4af37;font-size:1.2rem">الدعم الفني والتجاري</h2><p style="margin:0 0 8px;line-height:1.8">للمساعدة في الحساب أو الاشتراك أو بلاغات التشغيل، تواصل عبر البريد الرسمي:</p><p style="margin:0"><a href="mailto:support@ndsp.app" style="color:#f0cf67;font-weight:700;text-decoration:none">support@ndsp.app</a></p><p lang="en" dir="ltr" style="margin:12px 0 0;opacity:.82">Official support: support@ndsp.app</p>';
    host.appendChild(card);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount,{once:true}); else mount();
  setTimeout(mount,500); setTimeout(mount,1600);
  try{new MutationObserver(function(){mount();}).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
})();
</script>
