name: PR-030 Endpoint and Real-Data Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-endpoint-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR-030 tests
        run: node --test backend/tests/pr030-endpoint-real-data.test.cjs

      - name: Validate PR-030 accounting
        run: python3 scripts/governance/validate_pr030_endpoint_real_data.py

      - name: Validate capability governance
        run: |
          python3 scripts/governance/validate_full_capability_ui.py \
            --base-ref origin/main
