name: PR-070 Runtime Path Inventory

on:
  pull_request:
    paths:
      - "docs/99-governance/pr-070-runtime-path-inventory/**"
      - "scripts/governance/build_pr070_runtime_path_inventory.py"
      - "scripts/governance/validate_pr070_runtime_path_inventory.py"
      - "scripts/governance/tests/pr070-runtime-path-inventory.test.cjs"
      - ".github/workflows/pr070-runtime-path-inventory.yml"
  push:
    branches: [main]
    paths:
      - "docs/99-governance/pr-070-runtime-path-inventory/**"
      - "scripts/governance/build_pr070_runtime_path_inventory.py"
      - "scripts/governance/validate_pr070_runtime_path_inventory.py"
      - "scripts/governance/tests/pr070-runtime-path-inventory.test.cjs"
      - ".github/workflows/pr070-runtime-path-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/governance/validate_pr070_runtime_path_inventory.py .
      - run: node --test scripts/governance/tests/pr070-runtime-path-inventory.test.cjs
