name: PR-027 Gap Decomposition Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gap-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR-027 accounting
        run: python3 scripts/governance/validate_pr027_gap_decomposition.py

      - name: Validate capability governance
        run: |
          python3 scripts/governance/validate_full_capability_ui.py \
            --base-ref origin/main
