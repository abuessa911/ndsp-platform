name: PR-029 Remaining Quick Wins Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-remaining-quick-wins:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/user-portal-vite/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR-029 tests
        run: node --test backend/tests/pr029-remaining-quick-wins.test.cjs

      - name: Validate PR-029 accounting
        run: python3 scripts/governance/validate_pr029_remaining_quick_wins.py

      - name: Validate capability governance
        run: |
          python3 scripts/governance/validate_full_capability_ui.py \
            --base-ref origin/main

      - name: Install user portal dependencies
        working-directory: frontend/user-portal-vite
        run: npm ci --ignore-scripts

      - name: Build user portal
        working-directory: frontend/user-portal-vite
        run: npm run build
