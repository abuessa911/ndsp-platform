name: PR-034 TDL v2 Policy Restore Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tdl-v2-policy-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR-034 source tests
        run: node --test backend/tests/pr034-tdl-v2-policy-source.test.cjs

      - name: Validate PR-034 restoration
        run: python3 scripts/governance/validate_pr034_tdl_v2_policy_restore.py

      - name: Validate restored Python syntax
        run: |
          TARGET="$(
            python3 -c '
          import json
          from pathlib import Path
          data = json.loads(
              Path(
                  "docs/99-governance/"
                  "pr-034-restore-tdl-v2-policy/"
                  "PR034_SELECTED_SOURCE.json"
              ).read_text()
          )
          print(data["restored_target"])
          '
          )"
          python3 -m py_compile "$TARGET"

      - name: Validate capability governance
        run: |
          python3 scripts/governance/validate_full_capability_ui.py \
            --base-ref origin/main
