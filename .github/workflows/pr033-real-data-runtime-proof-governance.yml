name: PR-033 Real-Data Runtime Proof Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-data-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR-033 contract tests
        run: node --test backend/tests/pr033-real-data-runtime-proof.test.cjs

      - name: Validate PR-033 evidence
        run: python3 scripts/governance/validate_pr033_real_data_runtime_proof.py

      - name: Validate capability governance
        run: |
          python3 scripts/governance/validate_full_capability_ui.py \
            --base-ref origin/main
