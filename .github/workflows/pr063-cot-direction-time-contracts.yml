name: PR-063 COT Direction and Time Contracts

on:
  pull_request:
    paths:
      - "docs/99-governance/pr-063-cot-direction-time-contracts/**"
      - "scripts/governance/validate_pr063_cot_direction_time_contracts.py"
      - "scripts/governance/tests/pr063-cot-direction-time-contracts.test.cjs"
      - ".github/workflows/pr063-cot-direction-time-contracts.yml"
  push:
    branches: [main]
    paths:
      - "docs/99-governance/pr-063-cot-direction-time-contracts/**"
      - "scripts/governance/validate_pr063_cot_direction_time_contracts.py"
      - "scripts/governance/tests/pr063-cot-direction-time-contracts.test.cjs"
      - ".github/workflows/pr063-cot-direction-time-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/governance/validate_pr063_cot_direction_time_contracts.py .
      - run: node --test scripts/governance/tests/pr063-cot-direction-time-contracts.test.cjs
