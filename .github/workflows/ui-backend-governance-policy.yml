name: UI and Backend Governance Policy

on:
  pull_request:
    paths:
      - "docs/99-governance/ui-architecture/**"
      - "scripts/governance/validate_ui_backend_governance_policy.py"
      - "scripts/governance/validate_uiux_governance_v2.py"
      - "scripts/governance/tests/test_validate_uiux_governance_v2.py"
      - "scripts/governance/requirements-ui-backend-governance.txt"
      - ".github/workflows/ui-backend-governance-policy.yml"
      - "apps/**"
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "**/package.json"
      - "**/tsconfig*.json"
  push:
    branches:
      - main
    paths:
      - "docs/99-governance/ui-architecture/**"
      - "scripts/governance/validate_ui_backend_governance_policy.py"
      - "scripts/governance/validate_uiux_governance_v2.py"
      - "scripts/governance/tests/test_validate_uiux_governance_v2.py"
      - "scripts/governance/requirements-ui-backend-governance.txt"
      - ".github/workflows/ui-backend-governance-policy.yml"
      - "apps/**"
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "**/package.json"
      - "**/tsconfig*.json"
  workflow_dispatch:
    inputs:
      strict_warnings:
        description: "Treat governance warnings as failures"
        required: false
        default: false
        type: boolean
      full_v2_scan:
        description: "Run V2 guard against the full repository instead of the latest change set"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ui-backend-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-policy:
    name: Validate governance policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/governance/requirements-ui-backend-governance.txt

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r scripts/governance/requirements-ui-backend-governance.txt

      - name: Validate baseline policy structure
        run: |
          python scripts/governance/validate_ui_backend_governance_policy.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --policy-only \
            --report /tmp/ui-backend-governance-policy-report.json

      - name: Validate V2 governing policy structure
        run: |
          python scripts/governance/validate_uiux_governance_v2.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --policy-only \
            --report /tmp/uiux-governance-v2-policy-report.json

      - name: Run V2 validator unit tests
        run: |
          python -m unittest \
            scripts/governance/tests/test_validate_uiux_governance_v2.py

      - name: Determine V2 governance scan set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FULL_V2_SCAN: ${{ inputs.full_v2_scan || 'false' }}
        run: |
          set -euo pipefail

          OUT=/tmp/ndsp-uiux-v2-changed-files.txt
          : > "$OUT"

          if [[ "$FULL_V2_SCAN" == "true" ]]; then
            git ls-files | sort -u > "$OUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | sort -u > "$OUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA" | sort -u > "$OUT"
            else
              git show --pretty="" --name-only "$CURRENT_SHA" | sort -u > "$OUT"
            fi
          else
            git show --pretty="" --name-only "$CURRENT_SHA" | sort -u > "$OUT"
          fi

          echo "v2_scan_file_count=$(wc -l < "$OUT")"
          sed -n '1,200p' "$OUT"

      - name: Validate repository compliance
        env:
          STRICT_WARNINGS: ${{ inputs.strict_warnings || 'false' }}
        run: |
          args=(
            --repo-root "$GITHUB_WORKSPACE"
            --report /tmp/ui-backend-governance-report.json
          )

          if [[ "$STRICT_WARNINGS" == "true" ]]; then
            args+=(--strict-warnings)
          fi

          python scripts/governance/validate_ui_backend_governance_policy.py \
            "${args[@]}"

      - name: Enforce V2 design, exposure, and confidentiality guard
        env:
          STRICT_WARNINGS: ${{ inputs.strict_warnings || 'false' }}
          FULL_V2_SCAN: ${{ inputs.full_v2_scan || 'false' }}
        run: |
          args=(
            --repo-root "$GITHUB_WORKSPACE"
            --report /tmp/uiux-governance-v2-report.json
          )

          if [[ "$FULL_V2_SCAN" == "true" ]]; then
            args+=(--full-source-scan)
          else
            args+=(--changed-files /tmp/ndsp-uiux-v2-changed-files.txt)
          fi

          if [[ "$STRICT_WARNINGS" == "true" ]]; then
            args+=(--strict-warnings)
          fi

          python scripts/governance/validate_uiux_governance_v2.py \
            "${args[@]}"

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-backend-governance-validation
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/ui-backend-governance-policy-report.json
            /tmp/ui-backend-governance-report.json
            /tmp/uiux-governance-v2-policy-report.json
            /tmp/uiux-governance-v2-report.json
            /tmp/ndsp-uiux-v2-changed-files.txt
