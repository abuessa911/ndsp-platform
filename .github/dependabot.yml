version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: "/frontend/user-portal-vite"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
